# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Fastjson 1.2.24 Deserialization RCE (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's fastjson/1.2.24-rce, vendored in app/, run from the published image vulhub/fastjson:1.2.24.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-fastjson-1-2-24-rce

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.53.0/24, internet: true}    # the exploit calls back to the player's RMI/LDAP server

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 8090
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      image: vulhub/fastjson:1.2.24

checks:
  - name: the application answers
    http: http://web:8090/
    wait: 120
  - name: a posted JSON body is parsed
    script: checks/json.sh

message: |
  The Fastjson 1.2.24 application answers at {{ machines.web.ports.web.url }}.
  POST it a JSON object: Fastjson honours an @type key.
